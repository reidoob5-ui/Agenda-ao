<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="apple-mobile-web-app-title" content="Agenda Aqui" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Agenda Aqui — Online booking for professionals worldwide</title>
    <meta name="description" content="Booking page, reminders, video consultations and payments for salons, clinics, therapists, lawyers and consultants. Any language, time zone and currency." />
    <link rel="canonical" href="https://agenda-ao.vercel.app/" />
    <!-- Partilha (WhatsApp, Facebook, LinkedIn, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Agenda Aqui" />
    <meta property="og:title" content="Agenda Aqui — Online booking for professionals worldwide" />
    <meta property="og:description" content="Booking page, reminders, video consultations and payments. Any language, time zone and currency." />
    <meta property="og:url" content="https://agenda-ao.vercel.app/" />
    <meta property="og:image" content="https://agenda-ao.vercel.app/images/og.jpg" />

    <meta name="twitter:image" content="https://agenda-ao.vercel.app/images/og.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
      <style>
      /* Ecra de arranque: aparece logo, mesmo com internet lenta, antes do JavaScript chegar */
      html,body{margin:0;background:#fff7f4}
      .boot{min-height:100vh;display:grid;place-items:center;align-content:center;gap:16px;font-family:system-ui,sans-serif;color:#7a4a53}
      .boot-logo{width:54px;height:54px;border-radius:18px;background:#cf5b6c;display:grid;place-items:center;animation:boot-pulsa 1.4s ease-in-out infinite}
      .boot-logo i{display:block;width:22px;height:20px;border:3px solid #fff;border-radius:6px}
      .boot p{margin:0;font-weight:600;font-size:1.05rem;letter-spacing:.01em}
      @keyframes boot-gira{to{transform:rotate(360deg)}}
      @keyframes boot-pulsa{50%{transform:scale(1.08);opacity:.85}}
    </style>
  </head>
  <body>
    <div id="root"><div class="boot"><div class="boot-logo"><i></i></div><p>Agenda Aqui</p></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
